<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Calculate Sphere Volume</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 30px;
      }
      input[type="number"] {
        width: 100px;
      }
      input[type="button"] {
        margin-top: 10px;
      }
      p#result {
        margin-top: 20px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h2>Sphere Volume Calculator</h2>
    <form id="sphereForm">
      <label for="radius">Radius:</label>
      <input type="number" id="radius" required />
      <input
        type="button"
        value="Calculate Volume"
        onclick="calculateVolume()"
      />
    </form>
    <p id="result"></p>

    <script>
      function calculateVolume() {
        //Get radius
        const radius = document.getElementById("radius").value;

        // Check if the radius is valid
        if (radius <= 0 || isNaN(radius)) {
          document.getElementById("result").innerText =
            "Please enter a valid radius.";
          return;
        }

        // Calculate the volume using the formula V = (4/3) * π * r^3
        const volume = (4 / 3) * Math.PI * Math.pow(radius, 3);

        // Display the result
        document.getElementById("result").innerText =
          "The volume of the sphere is: " + volume.toFixed(2) + " cubic units.";
      }
    </script>
  </body>
</html>
