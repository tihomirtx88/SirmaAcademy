<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Change the content of a cell</title>
  </head>
  <body>
    <table id="myTable" border="1">
      <tr>
        <td>Row1 cell1</td>
        <td>Row1 cell2</td>
      </tr>
      <tr>
        <td>Row2 cell1</td>
        <td>Row2 cell2</td>
      </tr>
      <tr>
        <td>Row3 cell1</td>
        <td>Row3 cell2</td>
      </tr>
    </table>

    <form>
      <label for="row">Row: </label>
      <input type="number" id="row" name="row" /><br /><br />

      <label for="column">Column: </label>
      <input type="number" id="column" name="column" /><br /><br />

      <label for="content">Content: </label>
      <input type="text" id="content" name="content" /><br /><br />

      <input type="button" onclick="changeContent()" value="Change content" />
    </form>

    <script>
      function changeContent() {
        const row = document.getElementById("row").value;
        const column = document.getElementById("column").value;
        const content = document.getElementById("content").value;

        const table = document.getElementById("myTable");
        // console.log(table);

        // Check if the row and column exist in the table
        if (table.rows[row] && table.rows[row].cells[column]) {
          // Update the cell content
          table.rows[row].cells[column].innerHTML = content;
        } else {
          alert("Invalid row or column");
        }
      }
    </script>
  </body>
</html>
