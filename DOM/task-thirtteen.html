<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Interactive List</title>
    <style>
      #list-app {
        margin: 20px;
        font-family: Arial, sans-serif;
      }
      ul {
        list-style-type: none;
        padding: 0;
      }
      li {
        margin: 5px 0;
        padding: 5px;
        background-color: #f9f9f9;
        border: 1px solid #ddd;
        cursor: pointer;
      }
      li:hover {
        background-color: #eee;
      }
    </style>
  </head>
  <body>
    <div id="list-app">
      <p>
        Click on the item to change the text, or click on the button to create a
        new item.
      </p>
      <ul id="items"></ul>
      <input
        type="text"
        id="new-item-text"
        value=""
        placeholder="Enter new item text"
      />
      <button type="button" id="create-button">Create New</button>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const itemList = document.getElementById("items");
        const newItemInput = document.getElementById("new-item-text");
        const createButton = document.getElementById("create-button");

        // Function to create a new list item
        function createNewItem(text) {
          const li = document.createElement("li");
          li.textContent = text;
          li.addEventListener("click", function () {
            const newText = prompt("Edit item text:", li.textContent);
            if (newText !== null) {
              li.textContent = newText;
            }
          });
          itemList.appendChild(li);
        }

        // Add event listener to the create button
        createButton.addEventListener("click", function () {
          const newItemText = newItemInput.value.trim();
          if (newItemText !== "") {
            createNewItem(newItemText);
            newItemInput.value = "";
            newItemInput.focus();
          }
        });

        // Add a few initial items
        ["Item 1", "Item 2", "Item 3"].forEach(createNewItem);
      });
    </script>
  </body>
</html>
